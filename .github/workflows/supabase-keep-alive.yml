name: Supabase Keep-Alive Ping

on:
  schedule:
    # Runs at 04:00 UTC every 3 days (well within Supabase's 7-day inactivity window)
    - cron: '0 4 */3 * *'
  # Allows manual triggering from the GitHub Actions dashboard at any time
  workflow_dispatch:

jobs:
  ping:
    name: Ping Supabase Endpoints
    runs-on: ubuntu-latest
    steps:
      - name: Validate Secrets and Ping Supabase Services
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Missing Supabase credentials in repository secrets."
            echo "Please configure either SUPABASE_URL (or VITE_SUPABASE_URL) and SUPABASE_ANON_KEY (or VITE_SUPABASE_PUBLISHABLE_KEY) under Repository Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          # Strip trailing slash if present
          CLEAN_URL="${SUPABASE_URL%/}"

          echo "Pinging Supabase services at: ${CLEAN_URL}..."

          # 1. Ping Auth Gateway (GoTrue public settings endpoint called by Supabase client)
          AUTH_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --retry 3 \
            --retry-delay 5 \
            --max-time 15 \
            -X GET "${CLEAN_URL}/auth/v1/settings" \
            -H "apikey: ${SUPABASE_ANON_KEY}")

          if [ "$AUTH_STATUS" -eq 200 ]; then
            echo "✓ Auth service responded with HTTP $AUTH_STATUS"
          else
            echo "::warning::Auth service returned HTTP $AUTH_STATUS"
          fi

          # 2. Ping Database Gateway (PostgREST table preflight check)
          DB_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --retry 3 \
            --retry-delay 5 \
            --max-time 15 \
            -X OPTIONS "${CLEAN_URL}/rest/v1/profiles" \
            -H "apikey: ${SUPABASE_ANON_KEY}")

          if [ "$DB_STATUS" -eq 200 ]; then
            echo "✓ Database API gateway responded with HTTP $DB_STATUS"
          else
            echo "::warning::Database API gateway returned HTTP $DB_STATUS"
          fi

          # 3. Ping Storage Gateway (Storage status)
          STORAGE_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --retry 3 \
            --retry-delay 5 \
            --max-time 15 \
            -X GET "${CLEAN_URL}/storage/v1/status" \
            -H "apikey: ${SUPABASE_ANON_KEY}")

          if [ "$STORAGE_STATUS" -eq 200 ]; then
            echo "✓ Storage gateway responded with HTTP $STORAGE_STATUS"
          else
            echo "::warning::Storage gateway returned HTTP $STORAGE_STATUS"
          fi

          echo "🎉 Supabase keep-alive ping completed successfully on $(date -u)!"
